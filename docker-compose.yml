services:
  photobackup:
    build: .
    container_name: photobackup
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - BACKUP_ROOT=/data/backups
      - DB_PATH=/data/db/backup.db
      - MAX_CONTENT_LENGTH_MB=2048
    volumes:
      # HDD_PATH comes from .env - point it at wherever your external drive is mounted.
      - ${HDD_PATH}:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - photobackup
    # Uses the default bridge network + service name DNS, so cloudflared
    # reaches the app at http://photobackup:5000 automatically. That's why
    # the tunnel's Public Hostname in the Cloudflare dashboard should point
    # to http://photobackup:5000 rather than localhost:5000 when both
    # containers are on the same compose network (the default).
