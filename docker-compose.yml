services:
  photobackup:
    build: .
    container_name: photobackup
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - BACKUP_ROOT=/data/backups
      - DB_PATH=/data/db/backup.db
      - MAX_CONTENT_LENGTH_MB=2048
    volumes:
      # CHANGE THE LEFT SIDE to wherever your external HDD is mounted on the Ubuntu host.
      # Find it with `lsblk` or `df -h` first (see README.md).
      - /mnt/external_hdd/photobackup:/data
