version: "3.9"

services:
  backend:
    build: ./backend
    container_name: media_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: media_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: media_gallery
      MYSQL_USER: mediauser
      MYSQL_PASSWORD: mediapassword
    volumes:
      - mysql_data:/var/lib/mysql

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: media_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  mysql_data: