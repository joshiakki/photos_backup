<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<header>

    <h2>My Profile</h2>

    <button onclick="window.location='gallery.html'">

        Gallery

    </button>

</header>


<div class="profile-container">

    <img
        id="profileImage"
        class="profile-image"
        src="assets/default-profile.png">

    <br><br>

    <input
        type="file"
        id="profileFile">

    <button
        id="uploadProfile">

        Upload Profile Picture

    </button>

    <hr>

    <label>

        Username

    </label>

    <input
        id="username">

    <button
        id="updateProfile">

        Update Profile

    </button>

    <hr>

    <label>

        Current Password

    </label>

    <input
        type="password"
        id="currentPassword">

    <label>

        New Password

    </label>

    <input
        type="password"
        id="newPassword">

    <button
        id="changePassword">

        Change Password

    </button>

</div>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/profile.js"></script>

</body>

</html>
