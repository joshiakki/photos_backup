<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Photo Gallery
</title>


<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0066ff">


</head>

<script src="app.js"></script>

<body>


<div class="container">


<h1>
My Photos & Videos
</h1>


<button onclick="logout()">

Logout

</button>


<hr>



<h2>
Upload Media
</h2>



<input

type="file"

id="file"

accept="image/*,video/*"

>



<button onclick="upload()">

Upload

</button>



<p id="uploadMessage"></p>



<hr>



<h2>
Gallery
</h2>


<div id="gallery">

Loading...

</div>



</div>





<script>


const token =
localStorage.getItem("access_token");



if(!token){

    window.location.href="login.html";

}





async function upload(){


let file =

document.getElementById("file").files[0];



let formData = new FormData();


formData.append(

"file",

file

);



let response = await fetch(

"/api/media/upload",

{


method:"POST",


headers:{


"Authorization":

"Bearer "+token


},


body:formData


}

);



let data = await response.json();



document.getElementById(

"uploadMessage"

).innerHTML = data.message;



loadMedia();


}




async function loadMedia(){


let response = await fetch(

"/api/media/list",

{


headers:{


"Authorization":

"Bearer "+token


}


}

);



let media = await response.json();



let html="";



media.forEach(item=>{


html += `


<div class="media-card">


<p>

${item.filename}

</p>


<p>

Type:

${item.media_type}

</p>


<a href="/api/media/download/${item.id}"

target="_blank">

Open

</a>


</div>


`;


});



document.getElementById(

"gallery"

).innerHTML = html;


}





function logout(){


localStorage.removeItem(

"access_token"

);


localStorage.removeItem(

"refresh_token"

);


window.location.href="login.html";


}



loadMedia();



</script>



</body>


</html>
