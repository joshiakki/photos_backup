<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Login</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="login-container">

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/login.js"></script>

</body>

</html>
